<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FluffyList — Design review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ebe7df;color:#28231e;font-family:system-ui,-apple-system,sans-serif}.bar{position:sticky;top:0;z-index:10;background:#f8f5eeed;backdrop-filter:blur(16px);border-bottom:1px solid #d7d0c5;padding:12px 16px 10px}.barhead{display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:auto}.brand{font-size:11px;letter-spacing:2px;font-weight:750}.caption{color:#756e64;font-size:11px;margin-top:3px}.tabs{display:flex;gap:6px;max-width:1120px;margin:11px auto 0}.tabs button{padding:9px 13px;border:1px solid #d4cec4;border-radius:5px;background:#f9f6ef;color:#514a41;font-size:12px}.tabs button.active{background:#376a4e;color:#fff;border-color:#376a4e}.stage{padding:22px 12px;display:flex;justify-content:center}.device{width:min(100%,430px);height:min(820px,calc(100vh - 160px));min-height:660px;border:1px solid #d4cec4;border-radius:20px;overflow:hidden;background:#f7f3ec;box-shadow:0 22px 65px #392e1d24}.device iframe{width:100%;height:100%;border:0;display:block}.hint{text-align:center;color:#766e64;font-size:11px;padding:0 12px 20px}@media(min-width:760px){.bar{padding-left:28px;padding-right:28px}.stage{padding-top:26px}}
</style>
<header class="bar"><div class="barhead"><div><div class="brand">FLUFFYLIST &nbsp; / &nbsp; DESIGN REVIEW</div><div class="caption">One family cookbook, three different moments.</div></div><span style="font-size:18px">✳</span></div><nav class="tabs"><button class="active" data-screen="recipes">Recipes</button><button data-screen="meals">Meals</button><button data-screen="grocery">Grocery · Store Mode</button></nav></header>
<section class="stage"><div class="device"><iframe id="screen" src="fluffylist-cookbook-concept.html" title="FluffyList Recipes screen concept"></iframe></div></section><div class="hint">Use the tabs above to compare the three screen concepts at the same size.</div>
<script>
const screens={recipes:'fluffylist-cookbook-concept.html',meals:'fluffylist-week-concept.html',grocery:'fluffylist-grocery-concept.html'};const labels={recipes:'Recipes',meals:'Meals',grocery:'Grocery · Store Mode'};const frame=document.querySelector('#screen');document.querySelectorAll('.tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.tabs .active')?.classList.remove('active');button.classList.add('active');frame.src=screens[button.dataset.screen];frame.title='FluffyList '+labels[button.dataset.screen]+' screen concept'}));
</script>
</html>
